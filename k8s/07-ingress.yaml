apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kok-app-ingress
  namespace: kok-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kok-app-clusterip
                port:
                  number: 80