apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kok-node-monitor
  namespace: kok-prod
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      containers:
        - name: log-agent
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do echo $(date) - Monitoring Node $NODE_NAME; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"