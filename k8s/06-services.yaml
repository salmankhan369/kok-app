apiVersion: v1
kind: Service
metadata:
  name: kok-app-clusterip
  namespace: kok-prod
spec:
  type: ClusterIP
  selector:
    app: kok-app
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: kok-app-nodeport
  namespace: kok-prod
spec:
  type: NodePort
  selector:
    app: kok-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080