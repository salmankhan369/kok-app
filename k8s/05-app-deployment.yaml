apiVersion: apps/v1
kind: Deployment
metadata:
  name: kok-app-deployment
  namespace: kok-prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Update ke waqt max 1 extra pod banega
      maxUnavailable: 0  # Ek bhi pod down nahi hoga (Zero Downtime)
  selector:
    matchLabels:
      app: kok-app
  template:
    metadata:
      labels:
        app: kok-app
    spec:
      containers:
        - name: kok-app
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kok-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: kok-app-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10