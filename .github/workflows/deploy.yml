name: Build and Deploy KOK-APP to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kok-app
  EKS_CLUSTER_NAME: kok-app-eks

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Deploy Kubernetes Manifests & Trigger Rolling Update
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/02-configmap.yaml
          kubectl apply -f k8s/03-storage.yaml
          kubectl apply -f k8s/04-redis.yaml
          kubectl apply -f k8s/06-services.yaml
          kubectl apply -f k8s/07-ingress.yaml
          kubectl apply -f k8s/08-daemonset.yaml
          
          # Image URI ko dynamically update karke Rolling Update trigger karna
          sed -i "s|YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kok-app:latest|$IMAGE_URI|g" k8s/05-app-deployment.yaml
          kubectl apply -f k8s/05-app-deployment.yaml
          kubectl rollout status deployment/kok-app-deployment -n kok-prod